name: Feature or hardening request
description: Propose a new contract, mutant, adapter, CLI feature, or engineering improvement
title: "[feature] "
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What gap or risk does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they are worse.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - contracts / checker
        - calibration bed / mutants
        - gate / verification
        - CLI / API / adapters
        - p3 / p4 experiments
        - docs / release engineering
        - other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: I understand the runtime jar must stay dependency-free (`--release 17`).
          required: false
        - label: I understand new claims must be backed by a gate/mutant or labelled unobservable.
          required: false
